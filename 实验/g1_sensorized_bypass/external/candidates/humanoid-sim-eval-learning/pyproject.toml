[project]
name = "humanoid-sim-eval"
version = "0.1.0"
description = "Simulation evaluation framework for the Unitree G1 humanoid robot using MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.13.0.92",
    "noise>=1.2.2",
]
